name: Deploy to CodeRed Cloud

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  SITE_URL: "https://wagtail-sandbox.codered.cloud/"

jobs:
  lint:
    name: "1. Lint (Ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff
      - name: Ruff check
        run: ruff check . || echo "::warning::Ruff found issues"
      - name: Ruff format
        run: ruff format --check . || echo "::warning::Formatting differs"

  test:
    name: "2. Test (Django)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install coverage
      - name: Django system check
        run: python manage.py check --fail-level WARNING
      - name: Migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Tests
        run: |
          coverage run --source='.' manage.py test
          coverage report -m

  deploy:
    name: "3. Deploy to CodeRed Cloud"
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://wagtail-sandbox.codered.cloud/
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -z "${{ secrets.cr_token }}" ]; then echo "::error::Missing cr_token"; exit 1; fi
      - run: |
          wget -nv -O /usr/local/bin/cr "https://www.codered.cloud/cli/cr-linux"
          chmod +x /usr/local/bin/cr
      - env:
          CR_TOKEN: ${{ secrets.cr_token }}
        run: cr list
      - env:
          CR_TOKEN: ${{ secrets.cr_token }}
        run: |
          printf '1\n' | cr deploy wagtail-sandbox || printf '2\n' | cr deploy wagtail-sandbox
      - name: Post-deploy health gate
        id: health
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ env.SITE_URL }}" || echo 000)
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "status=$STATUS" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Site unhealthy after deploy (HTTP $STATUS)"
          exit 1
