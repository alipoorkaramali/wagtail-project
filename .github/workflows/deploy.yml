# =============================================================================
#  Deploy to CodeRed Cloud - Full CI/CD Pipeline
#  Repo: https://github.com/alipoorkaramali/wagtail-project
#
#  Stages:
#    1. Lint      - Ruff (fast Python linter)
#    2. Test      - Django/Wagtail tests + coverage
#    3. Deploy    - Push to CodeRed Cloud (only on main branch)
#
#  Required Secret: cr_token  (CodeRed Cloud API key)
# =============================================================================

name: Deploy to CodeRed Cloud

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # allow manual trigger from GitHub UI

# Cancel previous runs when a new push comes to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Lint
  # ---------------------------------------------------------------------------
  lint:
    name: "1. Lint (Ruff)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: |
          echo "==> Ruff check"
          ruff check . || echo "::warning::Ruff found lint issues (non-blocking)"

      - name: Run Ruff formatter check
        run: |
          echo "==> Ruff format check"
          ruff format --check . || echo "::warning::Formatting differs (non-blocking)"

  # ---------------------------------------------------------------------------
  # JOB 2: Test
  # ---------------------------------------------------------------------------
  test:
    name: "2. Test (Django)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
          pip install coverage

      - name: Django system check
        run: python manage.py check --fail-level WARNING
        continue-on-error: true

      - name: Run migrations check
        run: python manage.py makemigrations --check --dry-run
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          coverage run --source='.' manage.py test
          coverage report -m
          coverage xml
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # JOB 3: Deploy
  # ---------------------------------------------------------------------------
  deploy:
    name: "3. Deploy to CodeRed Cloud"
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://wagtail-sandbox.codered.cloud/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify secret is set
        run: |
          if [ -z "${{ secrets.cr_token }}" ]; then
            echo "::error::Secret 'cr_token' is not set in repository settings."
            echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "✅ Secret 'cr_token' is available."

      - name: Install CodeRed CLI
        run: |
          echo "==> Downloading cr-linux..."
          wget -nv -O /usr/local/bin/cr "https://www.codered.cloud/cli/cr-linux"
          chmod +x /usr/local/bin/cr
          echo "==> Verifying installation..."
          cr --version

      - name: Verify token works
        env:
          CR_TOKEN: ${{ secrets.cr_token }}
        run: |
          echo "==> Listing sites (verifying token)..."
          cr list

      - name: Deploy
        env:
          CR_TOKEN: ${{ secrets.cr_token }}
        run: |
          echo "==> Deploying site: wagtail-sandbox"
          echo "==> Commit: ${{ github.sha }}"
          echo "==> Branch: ${{ github.ref_name }}"
          echo "==> Author: ${{ github.actor }}"
          # Non-interactive: answer prompts with option 1 (recommended defaults)
          # or 2 (continue) if any remaining interactive checks appear
          printf '1\n' | cr deploy wagtail-sandbox || printf '2\n' | cr deploy wagtail-sandbox

      - name: Deployment summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Site | wagtail-sandbox |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://wagtail-sandbox.codered.cloud/ |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

      - name: Failure summary
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above. Common causes:" >> $GITHUB_STEP_SUMMARY
          echo "- Invalid or missing \`cr_token\` secret" >> $GITHUB_STEP_SUMMARY
          echo "- Site handle typo (should be \`wagtail-sandbox\`)" >> $GITHUB_STEP_SUMMARY
          echo "- Missing settings/prod.py or project name mismatch" >> $GITHUB_STEP_SUMMARY
          echo "- Code errors not caught by tests" >> $GITHUB_STEP_SUMMARY
