{% load wagtailimages_tags %}
<figure class="stream-image stream-image--{{ value.alignment }}">
  {% image value.image width-900 as img %}
  <img src="{{ img.url }}" alt="{{ value.image.title }}" width="{{ img.width }}" height="{{ img.height }}">
  {% if value.caption %}
    <figcaption>{{ value.caption }}</figcaption>
  {% endif %}
</figure>
