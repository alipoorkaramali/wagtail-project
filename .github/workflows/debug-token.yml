# =============================================================================
#  Debug Token - Diagnostic Workflow
#  تست می‌کنه که Secret درست کار می‌کنه یا نه
#  به‌صورت دستی از تب Actions اجرا کن
# =============================================================================

name: Debug CodeRed Token

on:
  workflow_dispatch:

jobs:
  debug:
    name: "Diagnose cr_token secret"
    runs-on: ubuntu-latest
    steps:
      - name: Check if secret is set
        run: |
          if [ -z "${{ secrets.cr_token }}" ]; then
            echo "❌ Secret 'cr_token' is NOT set."
            echo ""
            echo "Fix:"
            echo "  1. Go to Settings → Secrets and variables → Actions"
            echo "  2. Click 'New repository secret'"
            echo "  3. Name: cr_token"
            echo "  4. Value: <your CodeRed Cloud API key>"
            exit 1
          else
            echo "✅ Secret 'cr_token' is set."
            echo "   Length: ${#VAR} characters"
          fi
        env:
          VAR: ${{ secrets.cr_token }}

      - name: Install cr CLI
        run: |
          wget -nv -O /usr/local/bin/cr "https://www.codered.cloud/cli/cr-linux"
          chmod +x /usr/local/bin/cr
          echo "✅ cr CLI installed"
          cr --version

      - name: Verify token with cr list
        env:
          CR_TOKEN: ${{ secrets.cr_token }}
        run: |
          echo "==> Running 'cr list' to verify authentication..."
          cr list
          echo ""
          echo "✅ Token works! Your sites are listed above."

      - name: Show environment info
        run: |
          echo "==> Runner info"
          uname -a
          echo ""
          echo "==> Python version"
          python3 --version || true
          echo ""
          echo "==> Network connectivity to CodeRed"
          curl -sS -I https://www.codered.cloud/cli/cr-linux | head -5 || true
