# =============================================================================
#  Deploy to CodeRed Cloud - Full CI/CD Pipeline
# =============================================================================

name: Deploy to CodeRed Cloud

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: "1. Lint (Ruff)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: |
          echo "==> Ruff check"
          ruff check . || echo "::warning::Ruff found lint issues (non-blocking)"

      - name: Run Ruff formatter check
        run: |
          echo "==> Ruff format check"
          ruff format --check . || echo "::warning::Formatting differs (non-blocking)"

  test:
    name: "2. Test (Django)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system deps (mysqlclient)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
          pip install coverage

      - name: Django system check
        run: python manage.py check --fail-level WARNING
        continue-on-error: true

      - name: Run migrations check
        run: python manage.py makemigrations --check --dry-run
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          coverage run --source='.' manage.py test
          coverage report -m
          coverage xml
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  deploy:
    name: "3. Deploy to CodeRed Cloud"
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
      url: https://wagtail-sandbox.codered.cloud/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify secret is set
        run: |
          if [ -z "${{ secrets.cr_token }}" ]; then
            echo "::error::Secret 'cr_token' is not set in repository settings."
            exit 1
          fi
          echo "✅ Secret 'cr_token' is available."

      - name: Install CodeRed CLI
        run: |
          wget -nv -O /usr/local/bin/cr "https://www.codered.cloud/cli/cr-linux"
          chmod +x /usr/local/bin/cr
          cr --version

      - name: Verify token works
        env:
          CR_TOKEN: ${{ secrets.cr_token }}
        run: cr list

      - name: Deploy
        env:
          CR_TOKEN: ${{ secrets.cr_token }}
        run: |
          echo "==> Deploying site: wagtail-sandbox"
          echo "==> Commit: ${{ github.sha }}"
          printf '1\n' | cr deploy wagtail-sandbox || printf '2\n' | cr deploy wagtail-sandbox

      - name: Deployment summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "| Site | https://wagtail-sandbox.codered.cloud/ |" >> $GITHUB_STEP_SUMMARY

      - name: Failure summary
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
