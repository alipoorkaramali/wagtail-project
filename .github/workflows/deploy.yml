# =============================================================================
#  Deploy to CodeRed Cloud - Hardened CI/CD
#  - push / PR: Lint + Test (blocking)
#  - Deploy only via workflow_dispatch on main
#  - After Deploy: Health Gate
# =============================================================================

name: Deploy to CodeRed Cloud

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  SITE_URL: "https://wagtail-sandbox.codered.cloud/"

jobs:
  lint:
    name: "1. Lint (Ruff)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter (blocking, ignore import-sort)
        run: ruff check . --ignore I001

      - name: Run Ruff formatter check (warning only)
        run: |
          ruff format --check . || echo "::warning::Formatting differs (non-blocking)"

  test:
    name: "2. Test (Django)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system deps (mysqlclient)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install coverage

      - name: Django system check (blocking)
        run: python manage.py check --fail-level WARNING

      - name: Migrations check (blocking)
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations on test DB (blocking)
        run: python manage.py migrate --noinput

      - name: Run tests (blocking)
        run: |
          coverage run --source='.' manage.py test
          coverage report -m
          coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  deploy:
    name: "3. Deploy to CodeRed Cloud"
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://wagtail-sandbox.codered.cloud/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify secret is set
        run: |
          if [ -z "${{ secrets.cr_token }}" ]; then
            echo "::error::Secret 'cr_token' is not set."
            exit 1
          fi
          echo "✅ Secret 'cr_token' is available."

      - name: Install CodeRed CLI
        run: |
          wget -nv -O /usr/local/bin/cr "https://www.codered.cloud/cli/cr-linux"
          chmod +x /usr/local/bin/cr
          cr --version

      - name: Verify token works
        env:
          CR_TOKEN: ${{ secrets.cr_token }}
        run: cr list

      - name: Deploy
        env:
          CR_TOKEN: ${{ secrets.cr_token }}
        run: |
          echo "==> Deploying site: wagtail-sandbox"
          echo "==> Commit: ${{ github.sha }}"
          printf '1\n' | cr deploy wagtail-sandbox || printf '2\n' | cr deploy wagtail-sandbox

      - name: Post-deploy health gate
        id: health
        run: |
          URL="${{ env.SITE_URL }}"
          MAX_ATTEMPTS=10
          SLEEP_SECONDS=15
          STATUS="000"

          echo "==> Waiting for site to become healthy after deploy..."
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo "000")
            echo "Attempt $i/$MAX_ATTEMPTS — HTTP $STATUS"

            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "status=$STATUS" >> "$GITHUB_OUTPUT"
              echo "✅ Site is healthy (HTTP $STATUS)"
              exit 0
            fi

            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
              echo "Not ready yet. Waiting ${SLEEP_SECONDS}s..."
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "::error::Site still unhealthy after deploy (HTTP $STATUS). Consider Rollback."
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Site | https://wagtail-sandbox.codered.cloud/ |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | HTTP ${{ steps.health.outputs.status }} |" >> $GITHUB_STEP_SUMMARY

      - name: Failure summary
        if: failure()
        run: |
          echo "## ❌ Deployment or Health Gate Failed" >> $GITHUB_STEP_SUMMARY
          echo "If the site is down, run **Rollback Deployment** with a previous good SHA." >> $GITHUB_STEP_SUMMARY
